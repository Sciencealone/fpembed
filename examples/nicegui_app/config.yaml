# FPembed NiceGUI Optimization Application Configuration
# This file contains all settings for the application including paths, defaults, and parameters

# ============================================================================
# Descriptor Toggle Default
# Controls whether the "Include Molecular Descriptors" checkbox is checked on startup.
# When enabled, Optuna decides per-trial whether to include descriptors.
# When disabled, all trials use fingerprints only.
# ============================================================================
descriptors_enabled: false

# ============================================================================
# Results Table Configuration
# Controls pagination and chart display limits for the optimization results table
# ============================================================================
results_table:
  # Number of rows displayed per page in the Results table
  rows_per_page: 10
  # Number of top-ranked trials shown in bar charts and default prediction analysis
  top_n_charts: 10

# ============================================================================
# Fingerprint Type Enabled Defaults
# Per-FP-type default checkbox states on application startup.
# Set any type to false to uncheck it by default.
# ============================================================================
fp_defaults:
  ecfp:
    enabled: true
  atom_pair:
    enabled: true
  topological_torsion:
    enabled: true
  rdkit:
    enabled: true
  layered:
    enabled: true
  pattern:
    enabled: true

# ============================================================================
# Compression Method Enabled Defaults
# Per-method default checkbox states on application startup.
# Set any method to false to uncheck it by default.
# ============================================================================
compression_methods:
  geometric:
    enabled: true
  linear:
    enabled: true
  log:
    enabled: true
  uniform:
    enabled: true
  hadamard:
    enabled: true
  random_projection:
    enabled: true
  interleave_default: false

# ============================================================================
# Paths Configuration
# All paths are relative to the examples/nicegui_app/ directory
# ============================================================================
paths:
  # Directory containing molecular datasets
  datasets_dir: "../datasets"

  # SQLite cache database for fingerprints and descriptors
  cache_db: "cache.db"

# ============================================================================
# Random Seed for Reproducibility
# Used for all stochastic operations: sampling, splitting, and model training
# ============================================================================
random_seed: 42

# ============================================================================
# Dataset Configurations
# Defines available datasets with their file paths and target columns
# ============================================================================
datasets:
  RedDB:
    file: "clean_db_reddb.csv.gz"
    target: "gap"
  NFA:
    file: "clean_db_nfa.csv.gz"
    target: "gap"
  QM9:
    file: "clean_db_qm9.csv.gz"
    target: "gap"

# ============================================================================
# Fingerprint Parameter Options
# Defines available sizes and per-FP-type parameter ranges for all six types
# ============================================================================
fp_parameters:
  # Available fingerprint sizes (number of bits)
  sizes: [1024, 2048, 4096, 8192, 16384]

  # Per-FP-type parameter ranges [min, max] for Optuna sampling
  ecfp:
    radius: [2, 4]
  atom_pair:
    min_distance: [1, 3]
    max_distance: [10, 30]
  topological_torsion:
    torsion_atom_count: [4, 6]
  rdkit:
    min_path: [1, 2]
    max_path: [5, 7]
  layered:
    min_path: [1, 2]
    max_path: [5, 7]
  pattern: {}

# ============================================================================
# Fingerprint Compression Constraints
# Defines validation rules for compression factors
# ============================================================================
fp_constraints:
  # Minimum compression factor (must be power of 2)
  min_compression: 4

  # Maximum compression divisor (max compression = fp_size / max_compression_divisor)
  max_compression_divisor: 2

# ============================================================================
# Stopping Criteria Defaults
# Controls trial count and time limits for optimization
# ============================================================================
stopping_defaults:
  # Default number of trials
  default_trials: 100
  # Default time limit in seconds (0 = infinite / no time limit)
  default_time_limit: 0
  # Maximum allowed trials
  max_trials: 10000
  # Maximum allowed time in hours
  max_time_hours: 24

# ============================================================================
# Random Forest Default Hyperparameters
# Default values for Random Forest model configuration
# ============================================================================
random_forest_defaults:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 0.01

# ============================================================================
# Optuna Hyperparameter Optimization Settings
# ============================================================================
optuna_settings:
  default_n_trials: 100
  hyperparameter_ranges:
    n_estimators: [10, 1000]
    max_depth: [2, 50]
    min_samples_split: [0.001, 0.5]
    # Default state of the "Include unlimited depth (None)" checkbox
    include_none_depth: true
  optimization_metric: "R2"

# ============================================================================
# Train/Validation Split Defaults
# ============================================================================
split_defaults:
  train_ratio: 0.8
  n_bins: 10

# ============================================================================
# Subset Selection Defaults
# ============================================================================
subset_defaults:
  percentage: 100
  n_bins: 10

# ============================================================================
# Molecular Descriptors List
# Complete list of 73 RDKit descriptors used for molecular characterization
# ============================================================================
descriptors:
  # E-state indices
  - MaxEStateIndex
  - MinEStateIndex
  - MinAbsEStateIndex

  # Quality and molecular weight
  - qed
  - MolWt
  - FpDensityMorgan1

  # Topological descriptors
  - BalabanJ
  - HallKierAlpha
  - Ipc

  # PEOE VSA descriptors
  - PEOE_VSA1
  - PEOE_VSA2
  - PEOE_VSA3
  - PEOE_VSA4
  - PEOE_VSA5
  - PEOE_VSA6
  - PEOE_VSA7
  - PEOE_VSA8
  - PEOE_VSA9
  - PEOE_VSA10
  - PEOE_VSA11
  - PEOE_VSA12
  - PEOE_VSA13
  - PEOE_VSA14

  # SMR VSA descriptors
  - SMR_VSA1
  - SMR_VSA2
  - SMR_VSA3
  - SMR_VSA4
  - SMR_VSA5
  - SMR_VSA6
  - SMR_VSA7
  - SMR_VSA9
  - SMR_VSA10

  # SlogP VSA descriptors
  - SlogP_VSA1
  - SlogP_VSA2
  - SlogP_VSA3
  - SlogP_VSA4
  - SlogP_VSA5
  - SlogP_VSA6
  - SlogP_VSA7
  - SlogP_VSA8
  - SlogP_VSA9
  - SlogP_VSA10
  - SlogP_VSA12

  # Topological polar surface area
  - TPSA

  # EState VSA descriptors
  - EState_VSA1
  - EState_VSA2
  - EState_VSA3
  - EState_VSA4
  - EState_VSA5
  - EState_VSA6
  - EState_VSA7
  - EState_VSA8
  - EState_VSA9
  - EState_VSA11

  # VSA EState descriptors
  - VSA_EState1
  - VSA_EState2
  - VSA_EState3
  - VSA_EState4
  - VSA_EState5
  - VSA_EState6
  - VSA_EState7
  - VSA_EState8
  - VSA_EState10

  # Lipinski descriptors
  - FractionCSP3
  - NHOHCount
  - NumAromaticCarbocycles
  - NumAromaticHeterocycles
  - NumAromaticRings
  - NumHAcceptors
  - NumHDonors
  - NumRotatableBonds
  - RingCount

  # Physicochemical properties
  - MolLogP

# ============================================================================
# Session Persistence Settings
# Controls reconnection, periodic progress saving, and multi-tab management
# ============================================================================
session_persistence:
  # Seconds before the browser gives up reconnecting after a lost WebSocket
  # (passed to ui.run(); 3600 = 1 hour, accommodates sleep/wake cycles)
  reconnect_timeout: 3600

  # Seconds between periodic progress file writes during optimization
  progress_persist_interval: 30

  # Seconds to wait before promoting a secondary tab when the primary disconnects
  primary_tab_grace_period: 5
