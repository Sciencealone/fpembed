[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fpembed"
dynamic = ["version"]
description = "FPembed - Generalized fingerprint embedding library"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26.4,<3",
    "rdkit>=2023.9.6",
    "scikit-fingerprints>=2.1,<3",
    "selfies>=2.2",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]

[tool.setuptools.dynamic]
version = {attr = "fpembed.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpembed = ["py.typed"]

[project.urls]
"Homepage" = "https://github.com/Sciencealone/FPembed"
"Commercial & Research Support" = "https://github.com/Sciencealone/FPembed/blob/main/COMMERCIAL_SUPPORT.md"
"Issue Tracker" = "https://github.com/Sciencealone/FPembed/issues"
